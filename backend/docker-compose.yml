services:

  postgres:
    image: postgres:16
    container_name: teamboard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: teamboard
      POSTGRES_USER: teamboard
      POSTGRES_PASSWORD: teamboard2026

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: teamboard-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      JWT_SECRET: teamboard_secret_key

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: teamboard
      DB_USER: teamboard
      DB_PASSWORD: teamboard2026

    depends_on:
      - postgres


  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend

    container_name: teamboard-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data: